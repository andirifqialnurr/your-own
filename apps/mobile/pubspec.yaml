name: your_own
description: Your Own local-development mobile foundation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'
  flutter: '>=3.38.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: 17.5.0
  hugeicons: 1.2.0
  intl: 0.20.2
  shared_preferences: 2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  generate: true
  # No Material icon font, runtime font downloader, chart or identity SDK.
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
